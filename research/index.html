<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b181d"><meta name="description" content="FORMA Research — pesquisa, evidências, mapas, decisões e projetos em um único estúdio.">
<title>FORMA Research — seu laboratório de conhecimento</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css">
</head><body>
<div class="shell" id="shell">
 <aside class="rail" id="rail">
  <a class="brand" href="../"><span class="brand-icon">F<span>.</span></span><span class="brand-text"><b>FORMA <em>RESEARCH</em></b><small>KNOWLEDGE WORKSPACE</small></span></a>
  <div class="rail-label">ESPAÇO DE TRABALHO</div>
  <nav class="nav" id="mainNav" aria-label="Navegação principal">
   <button class="nav-link active" data-view="home"><span class="ni">▦</span>Painel geral</button>
   <button class="nav-link" data-view="projects"><span class="ni">▣</span>Meus projetos <span id="navCount" class="nav-count">0</span></button>
   <button class="nav-link" data-view="library"><span class="ni">◈</span>Biblioteca de fontes</button>
   <button class="nav-link" data-view="discover"><span class="ni">⌕</span>Pesquisa automática <span class="new-chip">GRÁTIS</span></button>
   <button class="nav-link" data-view="guide"><span class="ni">◇</span>Orientador local</button>
  </nav>
  <div class="rail-label label-between">PROJETOS RECENTES <button class="round-mini" id="quickNew" aria-label="Criar projeto">+</button></div>
  <div id="railProjects" class="rail-projects"></div>
  <div class="rail-bottom"><div class="privacy-line"><i></i><div><strong>Dados no seu dispositivo</strong><small>Privado por padrão · faça backups</small></div></div><a class="suite-link" href="../">↗ Voltar ao FORMA Studio</a><a class="suite-link" href="../slides/">↗ FORMA Slides</a><button class="suite-link as-button" id="openBackup">↧ Backup e recuperação</button><span class="version">FORMA RESEARCH / 1.0</span></div>
 </aside>
 <div class="rail-shade" id="railShade"></div>
 <main class="main">
  <header class="topbar">
    <div class="crumb"><button class="mobile-menu" id="openRail" aria-label="Abrir menu">☰</button><span class="crumb-icon">◈</span><span>FORMA STUDIO</span><b>/</b><strong id="crumbHere">Research</strong></div>
    <div class="topactions"><button class="search-trigger" id="globalSearchBtn">⌕ <span>Buscar tudo</span> <kbd>Ctrl K</kbd></button><span class="saved-status" id="saveStatus"><i></i> Salvo localmente</span><button class="btn accent top-new" id="topNew">+ Novo projeto</button></div>
  </header>
  <div class="content" id="content" tabindex="-1"></div>
 </main>
</div>
<div id="modalRoot"></div><div id="toast" role="status" aria-live="polite"></div>
<input type="file" accept=".json,application/json" id="backupFile" hidden>
<script src="app.js" defer></script>
</body></html>
