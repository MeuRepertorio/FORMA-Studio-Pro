name: FORMA Studio Pro · Aplicativo Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'repertorio.js'
      - 'style.css'
      - 'studio-v3.css'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icon.svg'
      - 'package.json'
      - 'desktop/**'
      - '.github/workflows/windows.yml'
permissions:
  contents: read
concurrency:
  group: forma-windows-build
  cancel-in-progress: false
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Compilar instalador e aplicativo portátil
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Conferir arquivos Windows
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter '*Setup*.exe' | Select-Object -First 1
          $portable = Get-ChildItem dist -Filter '*.exe' | Where-Object { $_.Name -notlike '*Setup*' } | Select-Object -First 1
          if (-not $setup -or -not $portable) { throw 'Os dois executáveis não foram gerados.' }
          Copy-Item $setup.FullName 'dist/FORMA-Studio-3-Instalador.exe'
          Copy-Item $portable.FullName 'dist/FORMA-Studio-3-Portatil.exe'
          Get-Item 'dist/FORMA-Studio-3-*.exe' | Select-Object Name,Length
      - name: Armazenar executáveis
        uses: actions/upload-artifact@v4
        with:
          name: FORMA-Studio-Windows-3.0
          path: |
            dist/FORMA-Studio-3-Instalador.exe
            dist/FORMA-Studio-3-Portatil.exe
          if-no-files-found: error
          retention-days: 60