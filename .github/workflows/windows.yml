name: FORMA Studio Pro · Instaladores Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'style.css'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icon.svg'
      - 'package.json'
      - 'desktop/**'
      - 'RELEASE_NOTES.md'
      - '.github/workflows/windows.yml'
permissions:
  contents: write
concurrency:
  group: forma-windows-release
  cancel-in-progress: false
jobs:
  package-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Compilar instalador e versão portátil
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Criar nomes estáveis para download
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter '*Setup*.exe' | Select-Object -First 1
          $portable = Get-ChildItem dist -Filter '*.exe' | Where-Object { $_.Name -notlike '*Setup*' } | Select-Object -First 1
          if (-not $setup -or -not $portable) { throw 'Arquivos executáveis não foram encontrados.' }
          Copy-Item $setup.FullName 'dist/FORMA-Studio-Pro-Instalador-Windows.exe'
          Copy-Item $portable.FullName 'dist/FORMA-Studio-Pro-Portatil-Windows.exe'
          Get-Item 'dist/FORMA-Studio-Pro-*-Windows.exe' | Select-Object Name,Length
      - name: Guardar executáveis nas ações
        uses: actions/upload-artifact@v4
        with:
          name: FORMA-Studio-Pro-Windows-2.0
          path: |
            dist/FORMA-Studio-Pro-Instalador-Windows.exe
            dist/FORMA-Studio-Pro-Portatil-Windows.exe
          if-no-files-found: error
          retention-days: 60
      - name: Tentar publicar executáveis na Release (opcional)
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $files = @('dist/FORMA-Studio-Pro-Instalador-Windows.exe','dist/FORMA-Studio-Pro-Portatil-Windows.exe')
          gh release view v2.0.0 --repo $env:GH_REPO *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v2.0.0 $files --repo $env:GH_REPO --clobber
          } else {
            gh release create v2.0.0 $files --repo $env:GH_REPO --title 'FORMA Studio Pro 2.0 · Windows' --notes-file RELEASE_NOTES.md --target $env:GITHUB_SHA --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'Falha na publicação dos executáveis.' }