name: Preparar motores do FORMA Slides
on:
  workflow_dispatch:
  push:
    paths:
      - 'slides/index.html'
      - '.github/workflows/forma-slides-deps.yml'
permissions:
  contents: write
jobs:
  install-libraries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gerar bibliotecas de importação e exportação
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p slides/vendor .forma-slides-deps
          cd .forma-slides-deps
          npm install --no-save --package-lock=false --ignore-scripts pptxgenjs@4.0.0 jszip@3.10.1
          cp node_modules/pptxgenjs/dist/pptxgen.bundle.js ../slides/vendor/pptxgen.bundle.js
          cp node_modules/jszip/dist/jszip.min.js ../slides/vendor/jszip.min.js
          test -s ../slides/vendor/pptxgen.bundle.js
          test -s ../slides/vendor/jszip.min.js
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add slides/vendor/pptxgen.bundle.js slides/vendor/jszip.min.js
          if ! git diff --cached --quiet; then
            git commit -m "chore(slides): bundle PowerPoint import and export engines"
            git push
          fi