name: Preparar motores do FORMA Slides
on:
  workflow_dispatch:
  push:
    paths:
      - 'slides/index.html'
      - '.github/workflows/forma-slides-deps.yml'
permissions:
  contents: write
jobs:
  install-libraries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar bibliotecas oficiais com versões fixadas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p slides/vendor
          curl --fail --location --retry 3 --silent --show-error \
            'https://unpkg.com/pptxgenjs@3.12.0/dist/pptxgen.bundle.js' \
            --output slides/vendor/pptxgen.bundle.js
          curl --fail --location --retry 3 --silent --show-error \
            'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js' \
            --output slides/vendor/jszip.min.js
          test $(wc -c < slides/vendor/pptxgen.bundle.js) -gt 100000
          test $(wc -c < slides/vendor/jszip.min.js) -gt 20000
          head -c 120 slides/vendor/pptxgen.bundle.js
          echo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add slides/vendor/pptxgen.bundle.js slides/vendor/jszip.min.js
          if ! git diff --cached --quiet; then
            git commit -m "chore(slides): vendor PowerPoint engines"
            git push
          fi