name: Publicar FORMA Studio (site)
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'downloads.html'
      - 'app.js'
      - 'style.css'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icon.svg'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: forma-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar site
        run: |
          mkdir -p _site
          cp index.html downloads.html app.js style.css manifest.webmanifest sw.js icon.svg _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4