name: FORMA V6 · Teste visual e rolagem móvel
on:
  push:
    branches: [main]
    paths:
      - index.html
      - editor/**
      - app.js
      - suite-fixed.css
      - suite-home.js
      - slides/index.html
      - research/index.html
      - tests/browser-v6.cjs
      - .github/workflows/forma-browser-v6.yml
  workflow_dispatch:
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright Chromium
        run: |
          mkdir -p .browser-deps
          cd .browser-deps
          npm install --no-audit --no-fund --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Validar Central, Editor, Slides, Research e rolagem por toque
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/forma-test-server.log 2>&1 &
          sleep 2
          NODE_PATH="$PWD/.browser-deps/node_modules" node tests/browser-v6.cjs